# --- A few common Meta-punctuation bindings worth having ---

# M-. → readline yank-last-arg (very useful in zsh)
[[keyboard.bindings]]
key = "Period"
mods = "Command"
chars = "\u001B."

# M-,
[[keyboard.bindings]]
key = "Comma"
mods = "Command"
chars = "\u001B,"

# M-/ → readline dabbrev-expand etc.
[[keyboard.bindings]]
key = "Slash"
mods = "Command"
chars = "\u001B/"

# M-;
[[keyboard.bindings]]
key = "Semicolon"
mods = "Command"
chars = "\u001B;"

# M-- (negative argument in readline)
[[keyboard.bindings]]
key = "Minus"
mods = "Command"
chars = "\u001B-"

# M-Space (just-one-space)
[[keyboard.bindings]]
key = "Space"
mods = "Command"
chars = "\u001B "

# --- Shifted Meta bindings (M-< M-> M-? are common) ---

# M-< → history-top
[[keyboard.bindings]]
key = "<"
mods = "Command|Shift"
chars = "\u001B<"

# M-> → history-bottom
[[keyboard.bindings]]
key = ">"
mods = "Command|Shift"
chars = "\u001B>"

# M-? → possible-completions
[[keyboard.bindings]]
key = "?"
mods = "Command|Shift"
chars = "\u001B?"