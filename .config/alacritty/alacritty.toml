[general]
import = [
    "~/.config/alacritty/themes/themes/solarized_light.toml"
]

# ──────────────────────────────────────────────────────────────────────
# Window / general
# ──────────────────────────────────────────────────────────────────────

[window]
opacity = 1.0
decorations = "buttonless"     # macOS title-bar buttons hidden, drag still works
startup_mode = "Windowed"
padding = { x = 6, y = 6 }
dynamic_padding = false
# Lets ⌥ also act as Meta (bonus path — costs nothing, gives you
# both ⌥-as-Meta AND ⌘-as-Meta after the bindings below).
option_as_alt = "Both"

[scrolling]
history = 10000                # tmux has its own scrollback; this catches pre-tmux output

[font]
size = 16.0

[font.normal]
family = "Menlo"               # swap for "JetBrains Mono", "Iosevka", etc.
style = "Regular"

[font.bold]
family = "Menlo"
style = "Bold"

[font.italic]
family = "Menlo"
style = "Italic"

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[mouse]
hide_when_typing = true

# Colors come from the solarized_light theme imported above — no [colors.*]
# blocks here on purpose.

# ──────────────────────────────────────────────────────────────────────
# Keybindings
#
# Strategy:
#  - Every ⌘<key> we want as Meta sends "^[<key>" (ESC + key).
#  - C / V / Q / X are intentionally absent from the Meta list, so
#    Alacritty's default ⌘C=Copy, ⌘V=Paste survive, ⌘Q quits via the
#    Cocoa app menu, and ⌘X falls through to nothing (terminals don't
#    have a meaningful Cut).
#  - We restate ⌘C and ⌘V as defensive belt-and-suspenders.
# ──────────────────────────────────────────────────────────────────────

# --- Exceptions: keep as macOS shortcuts ---

[[keyboard.bindings]]
key = "C"
mods = "Command"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Command"
action = "Paste"

# (⌘Q is handled by the Alacritty app menu — no binding needed.
#  ⌘X is left unbound; it just does nothing inside the terminal.)

# --- ⌘<letter> as Meta+letter (a–z, excluding c v q x) ---

[[keyboard.bindings]]
key = "A"
mods = "Command"
chars = "\u001Ba"

[[keyboard.bindings]]
key = "B"
mods = "Command"
chars = "\u001Bb"

