# --- ⌘<digit> as Meta+digit (useful for tmux window-switch, readline
#     numeric arguments, etc.) ---

[[keyboard.bindings]]
key = "Key0"
mods = "Command"
chars = "\u001B0"

[[keyboard.bindings]]
key = "Key1"
mods = "Command"
chars = "\u001B1"

[[keyboard.bindings]]
key = "Key2"
mods = "Command"
